<!DOCTYPE html>
<html data-theme="fantasy">
  <head>
    <title>Weather</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./assets/css/style.css" />
  </head>

  <body>
    <h1>Weather Dashboard</h1>
    <div class="container">
      <div class="weather-input">
        <div class="search">
          <h2>Search for a City:</h2>
          <input class="city-input" type="text" placeholder="San Diego" />
          <button class="search-btn">Search</button>
        </div>
        <div class="separator"></div>
        <div id="recent-searches"></div>
      </div>

      <div class="weather-data">
        <!-- Current weather will be inserted here dynamically -->
        <div class="current-weather"></div>

        <div class="days-forecast">
          <h2>5-Day Forecast:</h2>
          <!-- Forecast cards will be dynamically inserted here -->
          <ul class="weather-cards"></ul>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="assets/js/script.js"></script>
  </body>
</html>
